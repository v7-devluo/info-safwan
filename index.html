<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Base-V7</title>

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');

    :root {
      --primary: #ff4d4d;
      --secondary: #f9cb28;
      --accent: #ff6600;
      --dark: #000000;
      --darker: #0a0a0a;
      --light: #ffffff;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body {
      background: var(--dark);
      color: var(--light);
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    /* Background */
    .fire-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background:
        radial-gradient(circle at 20% 30%, rgba(255, 80, 0, 0.15) 0%, transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255, 120, 0, 0.15) 0%, transparent 25%),
        linear-gradient(to bottom, rgba(0,0,0,0.9), rgba(0,0,0,0.7));
      z-index: -2;
      animation: firePulse 8s infinite alternate;
    }
    @keyframes firePulse {
      0% { opacity: 0.7; background-size: 100% 100%; }
      100% { opacity: 1; background-size: 120% 120%; }
    }

    /* Particles */
    .fire-particle {
      position: absolute;
      border-radius: 50%;
      filter: blur(1px);
      bottom: -10px;
      z-index: -1;
      will-change: transform;
      animation-name: floatUp;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }
    @keyframes floatUp {
      0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(-100vh) translateX(20px) rotate(180deg); opacity: 0; }
    }

    /* Loading */
    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      z-index: 9999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 1s ease;
    }
    .loading-logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      border: 3px solid var(--secondary);
      box-shadow: 0 0 30px rgba(249, 203, 40, 0.7);
      animation:
        pulse 2s infinite alternate,
        scaleUp 3s infinite alternate,
        glow 3s infinite alternate;
      transform-origin: center center;
      object-fit: cover;
    }
    @keyframes pulse { 0% { transform: scale(1); } 100% { transform: scale(1.1); } }
    @keyframes scaleUp { 0%,100% { transform: scale(1); } 50% { transform: scale(1.2); } }
    @keyframes glow { 0% { box-shadow: 0 0 30px rgba(249,203,40,.7); } 100% { box-shadow: 0 0 50px rgba(249,203,40,.9); } }

    /* Layout */
    .container { max-width: 800px; margin: 0 auto; padding: 20px; transform-style: preserve-3d; }
    #main-content { display: none; }

    .profile {
      text-align: center;
      margin-bottom: 10px;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      transition: all 0.5s ease;
    }
    .profile-img {
      width: 200px;
      height: 200px;
      border-radius: 50%;
      object-fit: cover;
      border: 4px solid transparent;
      box-shadow: 0 0 20px var(--secondary), 0 0 40px rgba(249, 203, 40, 0.3);
      margin-bottom: 20px;
      transition: all 0.5s ease;
      animation: borderGlow 3s infinite alternate;
    }
    @keyframes borderGlow {
      0% { border-color: var(--primary); box-shadow: 0 0 20px var(--secondary), 0 0 40px rgba(249,203,40,.3); }
      100% { border-color: var(--secondary); box-shadow: 0 0 30px var(--primary), 0 0 60px rgba(255,77,77,.5); }
    }

    h1 {
      font-size: 3.5rem;
      margin-bottom: 15px;
      background: linear-gradient(to right, var(--primary), var(--secondary));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 10px rgba(255, 77, 77, 0.3);
      animation: flicker 2s infinite alternate;
      position: relative;
      font-weight: 900;
      letter-spacing: 2px;
    }
    h1::after {
      content: '';
      position: absolute;
      bottom: -10px;
      left: 25%;
      width: 50%;
      height: 4px;
      background: linear-gradient(to right, transparent, var(--primary), var(--secondary), transparent);
      border-radius: 4px;
      filter: blur(2px);
      animation: widthPulse 3s infinite alternate;
    }
    @keyframes flicker {
      0%,100% { opacity: 1; text-shadow: 0 0 10px var(--primary); }
      50% { opacity: 0.9; text-shadow: 0 0 20px var(--secondary); }
    }
    @keyframes widthPulse { 0% { width: 40%; } 100% { width: 60%; } }

    .greeting {
      text-align: center;
      margin-bottom: 18px;
      font-size: 1.5rem;
      color: var(--secondary);
      text-shadow: 0 0 10px rgba(249, 203, 40, 0.5);
      animation: flicker 2s infinite alternate;
      opacity: 0;
      transform: translateY(20px);
      transition: all .5s ease;
    }

/* ===== SMALLER BUTTON STYLE (same design, smaller size) ===== */
.action-row {
  margin: 14px auto 0; /* أقل شوية */
  display: flex;
  justify-content: center;
  gap: 12px; /* تقليل المسافة بين الأزرار */
  flex-wrap: wrap;
  opacity: 0;
  transform: translateY(20px);
  transition: all .5s ease;
}

.action-btn {
  appearance: none;
  border: none;
  cursor: pointer;
  text-decoration: none;
  background: rgba(255, 77, 77, 0.10);
  border: 1px solid rgba(255, 77, 77, 0.45);
  box-shadow: 0 0 14px rgba(255, 77, 77, 0.20);
  border-radius: 14px; /* أصغر */
  padding: 10px 14px; /* أصغر */
  min-width: 90px; /* أقل عرض */
  display: inline-flex;
  flex-direction: column;
  align-items: center;
  gap: 6px; /* تقليل الفراغ الداخلي */
  transition: transform .2s ease, box-shadow .2s ease, border-color .2s ease;
  color: var(--light);
}

.action-btn:hover {
  transform: translateY(-3px); /* حركة أخف */
  border-color: rgba(249, 203, 40, 0.65);
  box-shadow: 0 0 20px rgba(249,203,40,0.30);
}

.action-icon {
  width: 44px; /* أصغر */
  height: 44px; /* أصغر */
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: linear-gradient(45deg, var(--primary), var(--accent));
  box-shadow: 0 0 14px rgba(255, 77, 77, 0.30);
  color: var(--light);
  font-size: 1.05rem; /* تصغير الأيقونة */
}

.action-text {
  font-weight: 700;
  font-size: 0.85rem; /* تصغير النص */
  letter-spacing: .3px;
  color: var(--secondary);
  text-shadow: 0 0 8px rgba(249,203,40,.25);
}

    /* Birthday Row */
    .birthday-row{

      max-width: 520px;
      width: 100%;

      opacity: 0;
      transform: translateY(20px);
      transition: all .5s ease;

    .birthday-left{

    .birthday-label{

      text-transform: lowercase;
    }
    .birthday-gift{
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(249, 203, 40, 0.35);
      background: rgba(249, 203, 40, 0.10);
      box-shadow: 0 0 18px rgba(249,203,40,.15);
    }
    .birthday-gift i{
      font-size: 1.4rem;
      color: var(--secondary);
    }

    /* Cards */
    .info-card {
      background: rgba(26, 26, 46, 0.8);
      border-radius: 20px;
      padding: 30px;
      margin-bottom: 40px;
      border: 1px solid transparent;
      box-shadow: 0 0 30px rgba(255, 77, 77, 0.3);
      backdrop-filter: blur(10px);
      transition: all 0.5s ease;
      opacity: 0;
      transform: translateY(20px) scale(0.95);
      animation: cardGlow 4s infinite alternate;
    }
    @keyframes cardGlow {
      0%   { border-color: rgba(255, 77, 77, 0.3); box-shadow: 0 0 30px rgba(255, 77, 77, 0.3); }
      100% { border-color: rgba(249, 203, 40, 0.5); box-shadow: 0 0 50px rgba(249, 203, 40, 0.5); }
    }

    h2 {
      color: var(--secondary);
      margin-bottom: 20px;
      padding-bottom: 10px;
      border-bottom: 2px solid var(--primary);
      font-size: 2rem;
      font-weight: 700;
      text-shadow: 0 0 5px rgba(249, 203, 40, 0.5);
    }

    .typing-container { display: inline-block; overflow: hidden; }
    .typing-text {
      display: inline-block;
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid var(--secondary);
      width: 0;
    }
    @keyframes typing { from { width: 0 } to { width: 100% } }
    @keyframes blink-caret { from, to { border-color: transparent } 50% { border-color: var(--secondary) } }

    /* Responsive */
    @media (max-width: 768px) {
      .container { padding: 15px; }
      .profile-img { width: 150px; height: 150px; }
      h1 { font-size: 2.5rem; }
      .action-btn { min-width: 98px; padding: 12px 14px; }
      .action-icon { width: 52px; height: 52px; }
      .birthday-row { margin-top: 14px; }
    }
  </style>
</head>

  <script>
  // Rotate profile image on scroll (مثل قبل)
function setupScrollEffects() {
  const profileImg = document.querySelector('.profile-img');
  if (!profileImg) return;

  window.addEventListener('scroll', () => {
    const scrollY = window.scrollY || 0;
    const rotation = scrollY / 3; // نفس فكرة قبل
    profileImg.style.transform = `rotate(${rotation}deg)`;
  }, { passive: true });
}
    // DevTools / protection
    function detectDevTools() {
      const threshold = 500;
      const sizeCheck = (window.outerWidth - window.innerWidth > threshold ||
                         window.outerHeight - window.innerHeight > threshold);

      const mobileResizeCheck = detectMobileResize();
      const consoleCheck = detectDevToolsByDebugger();

      if (sizeCheck || mobileResizeCheck || consoleCheck) {
        window.location.href = '/warning';
        return true;
      }
      return false;
    }

    function detectMobileResize() {
      const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
      if (!isMobile) return false;

      const resizeThreshold = 0.7;
      const widthRatio = Math.abs(window.innerWidth - window.screen.width) / window.screen.width;
      const heightRatio = Math.abs(window.innerHeight - window.screen.height) / window.screen.height;

      return (widthRatio > resizeThreshold || heightRatio > resizeThreshold);
    }

    function detectDevToolsByDebugger() {
      let isOpen = false;
      const detector = { toString: function() { isOpen = true; return ''; } };
      console.log('%c', detector);
      console.dir(detector);
      return isOpen;
    }

    setInterval(detectDevTools, 500);

    document.addEventListener('contextmenu', function(e) {
      e.preventDefault();
      detectDevTools();
    });

    // منع اختصارات النسخ
    document.addEventListener('keydown', function(e) {
      e.preventDefault(); e.stopPropagation(); return false;
    }, true);
    document.addEventListener('keypress', function(e) {
      e.preventDefault(); e.stopPropagation(); return false;
    }, true);
    document.addEventListener('keyup', function(e) {
      e.preventDefault(); e.stopPropagation(); return false;
    }, true);

    // Fire particles
    function createFireParticles() {
      const fireBg = document.getElementById('fire-bg');
      const colors = ['#ff4d4d', '#f9cb28', '#ff6600', '#ff9900'];

      for (let i = 0; i < 30; i++) {
        const particle = document.createElement('div');
        particle.className = 'fire-particle';

        const size = Math.random() * 10 + 5;
        particle.style.width = `${size}px`;
        particle.style.height = `${size}px`;
        particle.style.background = colors[Math.floor(Math.random() * colors.length)];
        particle.style.left = `${Math.random() * 100}vw`;
        particle.style.bottom = `-${size}px`;

        const duration = Math.random() * 10 + 5;
        particle.style.animationDuration = `${duration}s`;
        particle.style.animationDelay = `${Math.random() * 5}s`;

        fireBg.appendChild(particle);
      }
    }

    // Typing animation
    function startTypingAnimations() {
      const typingElements = document.querySelectorAll('.typing-text');
      typingElements.forEach((el, index) => {
        setTimeout(() => {
          el.style.animation = 'typing 3.5s steps(40, end) forwards, blink-caret 0.75s step-end infinite';
        }, index * 300);
      });
    }

    // Page load effects
    function setupPageLoadEffects() {
      setTimeout(() => {
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.style.opacity = '0';

        setTimeout(() => {
          loadingScreen.style.display = 'none';
          document.getElementById('main-content').style.display = 'block';

          const elements = document.querySelectorAll(
            '.profile, .greeting, .action-row, .birthday-row, .info-card'
          );

          elements.forEach((el, index) => {
            setTimeout(() => {
              el.style.opacity = '1';
              el.style.transform = 'translateY(0) scale(1)';
            }, index * 120);
          });
        }, 1000);
      }, 2000);
    }

    window.addEventListener('DOMContentLoaded', () => {
      createFireParticles();
      setupPageLoadEffects();
      startTypingAnimations();      

      setInterval(() => {
        const particles = document.querySelectorAll('.fire-particle');
        particles.forEach(p => {
          const size = Math.random() * 10 + 5;
          p.style.width = `${size}px`;
          p.style.height = `${size}px`;
          p.style.left = `${Math.random() * 100}vw`;
          p.style.bottom = `-${size}px`;
          p.style.animationDuration = `${Math.random() * 10 + 5}s`;
          p.style.animationDelay = `${Math.random() * 2}s`;
        });
      }, 5000);
    });
  </script>
